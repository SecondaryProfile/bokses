<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bokses — know what's in every box.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bokses">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Bokses</title>
  <style>
    body {
      background-color: #0C0C0E;
      margin: 0;
      padding: 0;
    }
    @media (prefers-color-scheme: light) {
      body { background-color: #F5F5F7; }
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 108px;
      height: 108px;
      border-radius: 22px;
    }
    #splash .icon-dark  { display: block; }
    #splash .icon-light { display: none; }
    @media (prefers-color-scheme: light) {
      #splash .icon-dark  { display: none; }
      #splash .icon-light { display: block; }
    }
  </style>
  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="splash">
    <img class="icon-dark"  src="icons/splash_dark.png"  alt="Bokses">
    <img class="icon-light" src="icons/splash_light.png" alt="Bokses">
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            var splash = document.getElementById('splash');
            if (splash) {
              splash.classList.add('hidden');
              setTimeout(function() { splash.remove(); }, 400);
            }
          });
        }
      });
    });
  </script>
</body>
</html>
