name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test with coverage
        env:
          MIN_COVERAGE: 58
        run: bash tool/coverage.sh --reporter=github

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build web
        run: flutter build web --release

  server:
    name: API server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bokses_test
          POSTGRES_USER: bokses
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bokses -d bokses_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test (including against Postgres)
        env:
          BOKSES_TEST_DATABASE_URL: postgres://bokses:ci-only-password@localhost:5432/bokses_test
        run: dart test --reporter=github

  docker:
    name: Docker image + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bokses:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: nginx config is valid
        run: docker run --rm --entrypoint nginx bokses:ci -t

      - name: Start the stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)" > .env
          docker tag bokses:ci bokses-bokses:latest
          docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test through nginx on port 6692
        run: |
          set -eux
          base=http://localhost:6692
          curl -fsS "$base/" | grep -q '<title>'
          curl -fsS "$base/api/health"
          curl -fsS "$base/api/setup" | grep -q '"needsSetup":true'
          # First-run setup, then an authenticated call with the issued cookie.
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-test-password"}' "$base/api/setup"
          curl -fsS -b jar "$base/api/auth/me" | grep -q '"isRoot":true'
          # Setup is closed now, and data calls need a session.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"evil","password":"evil-password"}' "$base/api/setup")" = 409
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/boxes")" = 401
          # Postgres must not be reachable from the host. (`set -e` ignores a
          # negated command, so this is an explicit if.)
          if docker compose port postgres 5432 2>/dev/null; then
            echo "Postgres port is published to the host" >&2
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker compose logs --no-color

      - name: Refuses the placeholder password
        if: always()
        run: |
          docker compose down -v
          printf 'POSTGRES_PASSWORD=change-me\n' > .env
          docker compose up -d --no-build postgres
          docker compose run --rm --no-deps bokses 2>&1 | tee refuse.log || true
          grep -q 'still the placeholder' refuse.log
          docker compose down -v
