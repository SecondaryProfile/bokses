server {
    listen 8080;

    # Item photos are stored as data: URIs inside JSON bodies, which can be
    # a few MB for a single photo — the default 1M limit is too small.
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passed through as-is, not forced to $scheme: nginx itself only ever
        # speaks plain HTTP, but an external reverse proxy in front of it
        # (see README) sets this to "https", and the API server uses it to
        # decide whether to mark the session cookie Secure.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
