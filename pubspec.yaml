name: bokses
description: A bubbly box storage management app — know what's in every box.
publish_to: 'none'
version: 0.15.0+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0
  http: ^1.2.0
  image: ^4.2.0
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  uuid: ^4.3.3
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.0.0
  camera: ^0.11.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
